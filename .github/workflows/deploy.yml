name: CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/tangscott959/quizpal

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image-tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --tag "$IMAGE_NAME:latest" \
            --tag "$IMAGE_NAME:${{ steps.meta.outputs.image-tag }}" \
            .

      - name: Push image
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ steps.meta.outputs.image-tag }}"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Deploy container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.docker.outputs.image-tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          encode() {
            printf '%s' "$1" | base64 -w 0
          }

          DB_URL_B64="$(encode "$DB_URL")"
          DB_USERNAME_B64="$(encode "$DB_USERNAME")"
          DB_PASSWORD_B64="$(encode "$DB_PASSWORD")"
          GOOGLE_CLIENT_ID_B64="$(encode "$GOOGLE_CLIENT_ID")"
          GOOGLE_CLIENT_SECRET_B64="$(encode "$GOOGLE_CLIENT_SECRET")"

          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" \
            GHCR_USERNAME="$GHCR_USERNAME" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            IMAGE_NAME="$IMAGE_NAME" \
            IMAGE_TAG="$IMAGE_TAG" \
            DB_URL_B64="$DB_URL_B64" \
            DB_USERNAME_B64="$DB_USERNAME_B64" \
            DB_PASSWORD_B64="$DB_PASSWORD_B64" \
            GOOGLE_CLIENT_ID_B64="$GOOGLE_CLIENT_ID_B64" \
            GOOGLE_CLIENT_SECRET_B64="$GOOGLE_CLIENT_SECRET_B64" \
            'bash -s' <<'EOF'
          set -euo pipefail

          DB_URL="$(printf '%s' "$DB_URL_B64" | base64 -d)"
          DB_USERNAME="$(printf '%s' "$DB_USERNAME_B64" | base64 -d)"
          DB_PASSWORD="$(printf '%s' "$DB_PASSWORD_B64" | base64 -d)"
          GOOGLE_CLIENT_ID="$(printf '%s' "$GOOGLE_CLIENT_ID_B64" | base64 -d)"
          GOOGLE_CLIENT_SECRET="$(printf '%s' "$GOOGLE_CLIENT_SECRET_B64" | base64 -d)"

          if ! command -v docker >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo apt-get clean
              sudo rm -rf /var/lib/apt/lists/*
              sudo systemctl enable --now docker
            else
              echo "Docker is not installed and this host does not use apt-get."
              exit 1
            fi
          fi

          DOCKER="docker"
          if ! docker ps >/dev/null 2>&1; then
            DOCKER="sudo docker"
          fi

          $DOCKER system prune -af --volumes || true
          sudo journalctl --vacuum-time=1d || true
          df -h

          echo "$GHCR_TOKEN" | $DOCKER login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          $DOCKER pull "$IMAGE_NAME:$IMAGE_TAG"

          $DOCKER stop quizpal >/dev/null 2>&1 || true
          $DOCKER rm quizpal >/dev/null 2>&1 || true
          $DOCKER ps -q --filter publish=8080 | xargs -r $DOCKER stop
          $DOCKER ps -aq --filter publish=8080 | xargs -r $DOCKER rm
          sudo fuser -k 8080/tcp >/dev/null 2>&1 || true

          $DOCKER run -d \
            --name quizpal \
            --restart unless-stopped \
            -p 8080:8080 \
            -e DB_URL="$DB_URL" \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            -e GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            "$IMAGE_NAME:$IMAGE_TAG"

          for attempt in $(seq 1 18); do
            if curl -fsS http://localhost:8080/login >/dev/null; then
              break
            fi

            if [ "$attempt" -eq 18 ]; then
              $DOCKER ps -a
              $DOCKER logs --tail 200 quizpal
              exit 1
            fi

            sleep 5
          done
          $DOCKER image prune -f
          EOF
