spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quiz_db_new}
spring.datasource.username=${DB_USERNAME:quizpal}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
server.port=${SERVER_PORT:8080}

# Google OAuth2 SSO Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-dev-client-id}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-dev-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
